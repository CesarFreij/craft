<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRAFT</title>
    <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #06142f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #06142f;
    }

    body {
      overflow: hidden;
    }

    #craft-startup {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f8fafc;
      background:
        radial-gradient(circle at 50% 46%, rgba(37, 99, 235, 0.20), transparent 24%),
        radial-gradient(circle at 18% 20%, rgba(29, 78, 216, 0.17), transparent 30%),
        radial-gradient(circle at 83% 82%, rgba(6, 182, 212, 0.14), transparent 32%),
        linear-gradient(145deg, #06142f 0%, #091b40 48%, #061229 100%);
      opacity: 1;
      visibility: visible;
      transition:
        opacity 360ms cubic-bezier(.22, 1, .36, 1),
        visibility 360ms cubic-bezier(.22, 1, .36, 1);
    }

    #craft-startup.is-leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .craft-grid {
      position: absolute;
      inset: -80px;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(96, 165, 250, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96, 165, 250, 0.12) 1px, transparent 1px);
      background-size: 58px 58px;
      -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 72%);
      mask-image: radial-gradient(circle at center, #000 0%, transparent 72%);
      animation: craft-grid-drift 11s linear infinite;
    }

    .craft-aurora {
      position: absolute;
      width: 640px;
      height: 640px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(37, 99, 235, 0.12),
        rgba(34, 211, 238, 0.055) 38%,
        transparent 68%
      );
      filter: blur(45px);
      animation: craft-breathe 3.2s ease-in-out infinite;
    }

    .craft-scan {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 12%;
      height: 1px;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(103, 232, 249, 0.42), transparent);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.18);
      animation: craft-scan 4.1s ease-in-out infinite;
    }

    .craft-shell {
      position: relative;
      z-index: 2;
      width: min(88vw, 520px);
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .craft-system {
      position: relative;
      width: 250px;
      height: 250px;
      display: grid;
      place-items: center;
      margin-bottom: 32px;
    }

    .craft-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(148, 197, 255, 0.15);
    }

    .craft-ring-a {
      inset: 0;
      border-top-color: #60a5fa;
      border-right-color: rgba(96, 165, 250, 0.48);
      box-shadow: inset 0 0 28px rgba(37, 99, 235, 0.03);
      animation: craft-spin 3.2s linear infinite;
    }

    .craft-ring-b {
      inset: 26px;
      border-style: dashed;
      border-color: rgba(34, 211, 238, 0.27);
      animation: craft-spin-back 5.6s linear infinite;
    }

    .craft-ring-c {
      inset: 54px;
      border-left-color: #22d3ee;
      border-bottom-color: rgba(34, 211, 238, 0.42);
      animation: craft-spin 2.25s cubic-bezier(.65, 0, .35, 1) infinite;
    }

    .craft-orbit-dot {
      position: absolute;
      width: 9px;
      height: 9px;
      top: 25px;
      left: 47px;
      border-radius: 50%;
      background: #67e8f9;
      box-shadow:
        0 0 0 7px rgba(103, 232, 249, 0.07),
        0 0 27px rgba(103, 232, 249, 0.8);
      animation: craft-dot-pulse 1.5s ease-in-out infinite;
    }

    .craft-core {
      position: relative;
      z-index: 3;
      width: 126px;
      height: 126px;
      display: grid;
      place-items: center;
      border-radius: 35px;
      transform: rotate(45deg);
      background: linear-gradient(145deg, rgba(13, 42, 89, 0.97), rgba(6, 26, 61, 0.94));
      border: 1px solid rgba(103, 232, 249, 0.30);
      box-shadow:
        0 26px 68px rgba(2, 6, 23, 0.48),
        0 0 0 12px rgba(37, 99, 235, 0.035),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      animation: craft-core-pulse 2.8s ease-in-out infinite;
    }

    .craft-core-inner {
      transform: rotate(-45deg);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .craft-core-mark {
      position: relative;
      width: 28px;
      height: 28px;
      margin-bottom: 10px;
    }

    .craft-core-mark::before,
    .craft-core-mark::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 8px;
      border: 3px solid #60a5fa;
    }

    .craft-core-mark::after {
      transform: rotate(45deg) scale(.72);
      border-color: #22d3ee;
      box-shadow: 0 0 18px rgba(34, 211, 238, .4);
    }

    .craft-brand {
      color: #ffffff;
      font-size: 15px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 2.6px;
      text-indent: 2.6px;
    }

    .craft-erp {
      margin-top: 6px;
      color: #67e8f9;
      font-size: 6px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-indent: 1.8px;
      opacity: .8;
    }

    .craft-copy {
      width: min(88vw, 410px);
      text-align: center;
      direction: rtl;
    }

    .craft-title {
      margin: 0;
      color: #ffffff;
      font-size: 25px;
      line-height: 1.4;
      font-weight: 800;
      text-shadow: 0 10px 28px rgba(2, 6, 23, 0.32);
    }

    .craft-status {
      min-height: 22px;
      margin-top: 9px;
      color: rgba(203, 213, 225, 0.67);
      font-size: 12px;
      font-weight: 600;
      animation: craft-status-fade 2.5s ease-in-out infinite;
    }

    .craft-progress {
      position: relative;
      width: 100%;
      height: 4px;
      margin-top: 25px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
    }

    .craft-progress::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 44%;
      left: -44%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #2563eb 28%, #22d3ee 72%, transparent);
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.42);
      animation: craft-progress 1.7s cubic-bezier(.65, 0, .35, 1) infinite;
    }

    .craft-meta {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      direction: ltr;
      color: rgba(148, 163, 184, 0.44);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.55px;
    }

    .craft-meta-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow:
        0 0 0 4px rgba(34, 211, 238, 0.07),
        0 0 13px rgba(34, 211, 238, 0.55);
      animation: craft-dot-pulse 1.4s ease-in-out infinite;
    }

    @keyframes craft-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes craft-spin-back {
      to { transform: rotate(-360deg); }
    }

    @keyframes craft-grid-drift {
      to { transform: translate3d(58px, 58px, 0); }
    }

    @keyframes craft-breathe {
      0%, 100% { transform: scale(.92); opacity: .7; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    @keyframes craft-core-pulse {
      0%, 100% {
        box-shadow:
          0 26px 68px rgba(2, 6, 23, 0.48),
          0 0 0 12px rgba(37, 99, 235, 0.035),
          inset 0 1px 0 rgba(255, 255, 255, 0.09);
      }
      50% {
        box-shadow:
          0 29px 74px rgba(2, 6, 23, 0.55),
          0 0 0 17px rgba(34, 211, 238, 0.04),
          0 0 40px rgba(37, 99, 235, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
    }

    @keyframes craft-progress {
      from { left: -44%; }
      to { left: 100%; }
    }

    @keyframes craft-status-fade {
      0%, 100% { opacity: .48; }
      50% { opacity: 1; }
    }

    @keyframes craft-dot-pulse {
      0%, 100% { opacity: .48; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1.16); }
    }

    @keyframes craft-scan {
      0% { top: 13%; opacity: 0; }
      16% { opacity: .82; }
      50% { opacity: .34; }
      84% { opacity: .82; }
      100% { top: 87%; opacity: 0; }
    }
</style>
  </head>
  <body>

    <div id="craft-startup" aria-live="polite" aria-label="جاري تشغيل CRAFT">
      <div class="craft-grid"></div>
      <div class="craft-aurora"></div>
      <div class="craft-scan"></div>

      <main class="craft-shell">
        <section class="craft-system" aria-hidden="true">
          <div class="craft-ring craft-ring-a"></div>
          <div class="craft-ring craft-ring-b"></div>
          <div class="craft-ring craft-ring-c"></div>
          <div class="craft-orbit-dot"></div>

          <div class="craft-core">
            <div class="craft-core-inner">
              <div class="craft-core-mark"></div>
              <div class="craft-brand">CRAFT</div>
              <div class="craft-erp">ERP SYSTEM</div>
            </div>
          </div>
        </section>

        <section class="craft-copy">
          <h1 class="craft-title">جاري تجهيز مساحة العمل</h1>
          <div class="craft-status">نرتّب بياناتك ونجهّز النظام للانطلاق...</div>
          <div class="craft-progress" aria-hidden="true"></div>

          <div class="craft-meta">
            <span class="craft-meta-dot"></span>
            <span>CRAFT • SYSTEM STARTUP</span>
          </div>
        </section>
      </main>
    </div>

  </body>
</html>
